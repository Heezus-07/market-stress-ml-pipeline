# =============================================================================
# Model Configuration (Grid Search)
# =============================================================================

general:
  random_state: 42
  n_jobs: -1

# -----------------------------------------------------------------------------
# Forecast Horizons
# -----------------------------------------------------------------------------

horizons:
  - 1
  - 3
#  - 5

# -----------------------------------------------------------------------------
# Models (Parameter Grids)
# -----------------------------------------------------------------------------

models:

  logistic_regression:
    enabled: true
    param_grid:
      penalty: [l2, l1]
      C: [0.01, 0.1, 1.0, 10.0]
      solver: [liblinear]
      max_iter: [1000]
      class_weight: [balanced]

  xgboost:
    enabled: true
    param_grid:
      n_estimators: [200, 400]
      max_depth: [4, 6, 8]
      learning_rate: [0.05, 0.1]
      gamma: [0, 0.1]
      min_child_weight: [1, 5]
      reg_lambda: [1, 5]
      subsample: [0.8]
      colsample_bytree: [0.8]
      objective: [binary:logistic]
      eval_metric: [aucpr]
      scale_pos_weight: [auto]
      random_state: [42]

  catboost:
    enabled: true
    param_grid:
      iterations: [200, 400]
      depth: [4, 6, 8]
      learning_rate: [0.05, 0.1]
      l2_leaf_reg: [1, 5, 10]
      min_data_in_leaf: [5, 10]
      auto_class_weights: [Balanced]
      verbose: [0]
      random_seed: [42]

  garch:
    enabled: true
    param_grid:
      p: [1, 2]
      q: [1, 2]
      mean: [Zero]
      distribution: [normal, t]

# -----------------------------------------------------------------------------
# Evaluation Metrics
# -----------------------------------------------------------------------------

metrics:
  primary:
    - pr_auc
  secondary:
    - f1
    - recall
    - precision_at_k

precision_at_k:
  k:
    - 0.05
    - 0.10

# -----------------------------------------------------------------------------
# Walk-Forward Validation
# -----------------------------------------------------------------------------

walk_forward:
  initial_train_year: 2019
  test_window: 1y
  expanding_window: true